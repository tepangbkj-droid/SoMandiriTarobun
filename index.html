<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarobun Green Pramuka Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Development version for easy setup) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Configuration to match premium look -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#6D28D9',
              dark: '#1E1B4B'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

  <!-- React Root Element -->
  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation tab state
      const [activeTab, setActiveTab] = useState('dashboard');
      const [notification, setNotification] = useState(null);
      const [showConfig, setShowConfig] = useState(false);

      // Re-initialize icons on every render to ensure they show up in tabs
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Configuration states (Saved in LocalStorage)
      const [config, setConfig] = useState({
        telegramBotToken: '',
        telegramChatId: '',
        googleAppScriptUrl: ''
      });

      // Default empty templates
      const getEmptySalesState = (dateStr = new Date().toISOString().split('T')[0]) => ({
        tanggal: dateStr,
        suhuFreezer: '',
        suhuChiller: '',
        soldBuns: {
          original: '',
          coklat: '',
          vanilla: '',
          peach: '',
          lemon: '',
          raspberry: '',
          familyBox: ''
        },
        soldBeverages: {
          taroLatte: '',
          chocolateIced: '',
          taroStrawberryCheese: '',
          taroBlueberry: ''
        },
        financials: {
          value: '',
          cash: '',
          edc: '',
          transaksi: ''
        },
        waste: {
          fdNempel: '',
          bunRejectThawing: '',
          doughPecahProofing: '',
          doughGagalBaking: '',
          rotiMatang: ''
        }
      });

      const getEmptyInventoryState = (dateStr = new Date().toISOString().split('T')[0]) => ({
        tanggal: dateStr,
        frozenDough: '',
        toppingTaro: '',
        fillingCoklat: '',
        fillingVanilla: '',
        fillingLemon: '',
        fillingPeach: '',
        fillingRaspberry: '',
        
        // Ingredients
        uht: '',
        taroPowder: '',
        coklatPowder: '',
        whippingCream: '',
        ndcPowder: '',
        cheesePowder: '',
        strawberryKonsentrat: '',
        strawberrySyrup: '',
        blueberryKonsentrat: '',

        // Packaging & Operations
        paperPouch: '',
        familyPack: '',
        plastik20: '',
        plastik25: '',
        plastik35: '',
        cupbler22: '',
        cuplid22: '',
        cupTrayS: '',
        cupTrayM: '',
        glovesM: '',
        glovesL: '',
        glovesXL: '',
        trashBag: '',
        thermalPaper: '',
        kuraflexHijau: '',
        kuraflexPink: '',
        kitchenMask: ''
      });

      const [salesData, setSalesData] = useState(() => getEmptySalesState());
      const [inventoryData, setInventoryData] = useState(() => getEmptyInventoryState());
      const [historyList, setHistoryList] = useState([]);

      // Toast notification helper
      const showToast = (message) => {
        setNotification(message);
        setTimeout(() => setNotification(null), 3000);
      };

      // Load config & history on start
      useEffect(() => {
        const savedHistory = localStorage.getItem('tarobun_history_web');
        if (savedHistory) {
          setHistoryList(JSON.parse(savedHistory));
        }
        const savedConfig = localStorage.getItem('tarobun_config_web');
        if (savedConfig) {
          setConfig(JSON.parse(savedConfig));
        }
      }, []);

      const numVal = (val) => {
        const parsed = parseFloat(val);
        return isNaN(parsed) ? 0 : parsed;
      };

      // Dashboard Calculations for Buns
      const calculateTotalBunsSold = (buns) => {
        const individual = 
          numVal(buns.original) + 
          numVal(buns.coklat) + 
          numVal(buns.vanilla) + 
          numVal(buns.peach) + 
          numVal(buns.lemon) + 
          numVal(buns.raspberry);
        const boxTotal = numVal(buns.familyBox) * 6;
        return individual + boxTotal;
      };

      const totalBunsSold = calculateTotalBunsSold(salesData.soldBuns);

      const calculateTotalBeveragesSold = (bevs) => {
        return Object.values(bevs).reduce((a, b) => numVal(a) + numVal(b), 0);
      };

      const totalBeveragesSold = calculateTotalBeveragesSold(salesData.soldBeverages);

      // Usage Formulas (Dough & Fillings) -> KG
      const toppingTaroUsedKg = (totalBunsSold * 25) / 1000;
      const fillingCoklatUsedKg = (numVal(salesData.soldBuns.coklat) * 25) / 1000;
      const fillingVanillaUsedKg = (numVal(salesData.soldBuns.vanilla) * 25) / 1000;
      const fillingPeachUsedKg = (numVal(salesData.soldBuns.peach) * 25) / 1000;
      const fillingLemonUsedKg = (numVal(salesData.soldBuns.lemon) * 25) / 1000;
      const fillingRaspberryUsedKg = (numVal(salesData.soldBuns.raspberry) * 25) / 1000;

      // --- KULKULASI BAHAN BAKU BEVERAGES (KONSOLIDASI KE KG) ---
      const taroLatteSales = numVal(salesData.soldBeverages.taroLatte);
      const taroStrawCheeseSales = numVal(salesData.soldBeverages.taroStrawberryCheese);
      const taroBlueberrySales = numVal(salesData.soldBeverages.taroBlueberry);
      
      // 1. All Varian Taro Latte terjual (Taro Latte + Strawberry Cheese + Blueberry)
      const totalAllTaroVarian = taroLatteSales + taroStrawCheeseSales + taroBlueberrySales;

      // Base Formula per cup (Semua Varian Taro Latte):
      // - NDC: 25 Gram
      // - Taro Powder: 40 Gram
      // - Susu UHT: 100 ML
      const baseNdcGrams = totalAllTaroVarian * 25;
      const baseTaroPowderGrams = totalAllTaroVarian * 40;
      const baseUhtMl = totalAllTaroVarian * 100;

      // 2. Varian Stroberi Cheese (Per Cup terjual):
      // - Cheese Powder: 0.48 Gram
      // - Susu UHT: 9.76 ML
      // - Whipping Cream: 9.76 ML
      // - Stroberi Saus: 20 Gram
      const addCheesePowderGrams = taroStrawCheeseSales * 0.48;
      const addUhtMlStrawCheese = taroStrawCheeseSales * 9.76;
      const addWhipCreamGramsStrawCheese = taroStrawCheeseSales * 9.76;
      const addStrawSausGramsStrawCheese = taroStrawCheeseSales * 20;

      // 3. Varian Blueberry (Per Cup terjual):
      // - Stroberi Sirup: 6 Gram
      // - Susu UHT: 12 Gram (dianggap setara 12 ml)
      // - Whipping Cream: 12 Gram
      // - Blueberry Saus: 20 Gram
      const addStrawSyrupGramsBlueberry = taroBlueberrySales * 6;
      const addUhtMlBlueberry = taroBlueberrySales * 12;
      const addWhipCreamGramsBlueberry = taroBlueberrySales * 12;
      const addBlueberrySausGrams = taroBlueberrySales * 20;

      // --- GABUNGKAN BARANG DASAR YANG SAMA DAN JADIKAN KILOGRAM (KG) ---
      
      // Susu UHT Total (Base 100ml + Str Cheese 9.76ml + Blueberry 12ml)
      const totalUhtVolume = baseUhtMl + addUhtMlStrawCheese + addUhtMlBlueberry;
      const bevUhtKg = totalUhtVolume / 1000;

      // Whipping Cream Total (Str Cheese 9.76g + Blueberry 12g)
      const totalWhippingCreamGrams = addWhipCreamGramsStrawCheese + addWhipCreamGramsBlueberry;
      const bevWhipCreamKg = totalWhippingCreamGrams / 1000;

      // NDC Powder Total
      const bevNdcKg = baseNdcGrams / 1000;

      // Taro Powder Total
      const bevTaroPowderKg = baseTaroPowderGrams / 1000;

      // Cheese Powder Total
      const bevCheesePowderKg = addCheesePowderGrams / 1000;

      // Stroberi Sirup Total
      const bevStrawSyrupKg = addStrawSyrupGramsBlueberry / 1000;

      // Blueberry Saus Total (Baru)
      const bevBlueberrySausKg = addBlueberrySausGrams / 1000;

      // Stroberi Saus Total (Baru)
      const bevStrawSausKg = addStrawSausGramsStrawCheese / 1000;


      const formatIndonesianDate = (dateStr) => {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      };

      const handleClearForm = () => {
        const today = new Date().toISOString().split('T')[0];
        setSalesData(getEmptySalesState(today));
        setInventoryData(getEmptyInventoryState(today));
        showToast('Form telah dikosongkan! Siap untuk input hari baru. 🧼');
      };

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem('tarobun_config_web', JSON.stringify(config));
        showToast('Konfigurasi integrasi disimpan! ⚙️');
        setShowConfig(false);
      };

      // Simulated Database - Save locally
      const handleSaveToDevice = () => {
        const newEntry = {
          id: Date.now().toString(),
          tanggal: salesData.tanggal,
          totalSales: totalBunsSold,
          revenue: numVal(salesData.financials.value),
          sales: { ...salesData },
          inventory: { ...inventoryData }
        };

        const updatedHistory = [newEntry, ...historyList.filter(h => h.tanggal !== salesData.tanggal)];
        setHistoryList(updatedHistory);
        localStorage.setItem('tarobun_history_web', JSON.stringify(updatedHistory));
        showToast('Laporan berhasil disimpan di HP! 📱');

        // Sync with Google Apps Script if URL provided
        if (config.googleAppScriptUrl) {
          syncToGoogleSheets(newEntry);
        }
      };

      const syncToGoogleSheets = async (dataPayload) => {
        try {
          showToast('Menghubungkan ke Google Sheets... ☁️');
          await fetch(config.googleAppScriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataPayload)
          });
          showToast('Sinkronisasi Google Sheets Berhasil! 🟢');
        } catch (error) {
          console.error(error);
          showToast('Gagal terhubung ke Google Sheets. Cek kembali URL Anda.');
        }
      };

      // Load 29 May 2026 Sample Data
      const handleLoadSampleData = () => {
        setSalesData({
          tanggal: '2026-05-29',
          suhuFreezer: -18,
          suhuChiller: 2,
          soldBuns: {
            original: 70,
            coklat: 76,
            vanilla: 84,
            peach: 22,
            lemon: 14,
            raspberry: 21,
            familyBox: 60
          },
          soldBeverages: {
            taroLatte: 28,
            chocolateIced: 0,
            taroStrawberryCheese: 6,
            taroBlueberry: 3
          },
          financials: {
            value: 10315000,
            cash: 0,
            edc: 10315000,
            transaksi: 203
          },
          waste: {
            fdNempel: 0,
            bunRejectThawing: 0,
            doughPecahProofing: 0,
            doughGagalBaking: 35,
            rotiMatang: 81
          }
        });

        setInventoryData({
          tanggal: '2026-05-29',
          frozenDough: 1481,
          toppingTaro: 83,
          fillingCoklat: 31,
          fillingVanilla: 29,
          fillingLemon: 28,
          fillingPeach: 28,
          fillingRaspberry: 24,
          
          uht: 6,
          taroPowder: 4.8,
          coklatPowder: 1,
          whippingCream: 8,
          ndcPowder: 8,
          cheesePowder: 3,
          strawberryKonsentrat: 4,
          strawberrySyrup: 1,
          blueberryKonsentrat: 3,

          paperPouch: 2300,
          familyPack: 194,
          plastik20: 30,
          plastik25: 20,
          plastik35: 40,
          cupbler22: 163,
          cuplid22: 124,
          cupTrayS: 75,
          cupTrayM: 50,
          glovesM: 0,
          glovesL: 3,
          glovesXL: 0,
          trashBag: 3,
          thermalPaper: 0,
          kuraflexHijau: 3,
          kuraflexPink: 3,
          kitchenMask: 0
        });
        showToast('Data contoh 29 Mei 2026 berhasil dimuat! 🧁');
      };

      const generateReportString = (sales, inv) => {
        const formattedDate = formatIndonesianDate(sales.tanggal);
        const totalBuns = calculateTotalBunsSold(sales.soldBuns);
        const totalBeverages = calculateTotalBeveragesSold(sales.soldBeverages);

        return `*LAPORAN PENJUALAN TAROBUN GREEN PRAMUKA*
Tanggal: ${formattedDate}

Suhu freezer : ${sales.suhuFreezer || '-'}°
Suhu chiller : ${sales.suhuChiller || '-'}°

*Sold hari ini (pcs)* :
Original : ${sales.soldBuns.original || 0} pcs
Coklat : ${sales.soldBuns.coklat || 0} pcs
Vanilla : ${sales.soldBuns.vanilla || 0} pcs
Peach : ${sales.soldBuns.peach || 0} pcs
Lemon : ${sales.soldBuns.lemon || 0} pcs
Raspberry : ${sales.soldBuns.raspberry || 0} pcs
Family box : ${sales.soldBuns.familyBox || 0} box (${numVal(sales.soldBuns.familyBox) * 6} pcs)
*Total : ${totalBuns} pcs*

*Beverage* :
Taro latte : ${sales.soldBeverages.taroLatte || 0} cup
Chocolate iced : ${sales.soldBeverages.chocolateIced || 0} cup
Tarolatte strawberry cheese : ${sales.soldBeverages.taroStrawberryCheese || 0} cup
Tarolatte blueberry : ${sales.soldBeverages.taroBlueberry || 0} cup
*Total : ${totalBeverages} cup*

*Financials & Transaksi* :
Value : Rp. ${numVal(sales.financials.value).toLocaleString('id-ID')}
Cash : Rp. ${numVal(sales.financials.cash).toLocaleString('id-ID')}
EDC : Rp. ${numVal(sales.financials.edc).toLocaleString('id-ID')}
Jumlah Transaksi : ${sales.financials.transaksi || 0}

*Waste* :
FD Nempel/Reject : ${sales.waste.fdNempel || '-'} pcs
Bun Reject Thawing : ${sales.waste.bunRejectThawing || '-'} pcs
Dough Pecah proofing : ${sales.waste.doughPecahProofing || '-'} pcs
Dough gagal baking : ${sales.waste.doughGagalBaking || '-'} pcs
Roti matang : ${sales.waste.rotiMatang || '-'} pcs

------------------------------------------

*STOK INVENTORY TAROBUN GREEN PRAMUKA*

*Frozen Dough & Fillings* :
Frozen Dough : ${inv.frozenDough || 0} pcs
Topping Taro : ${inv.toppingTaro || 0} pcs (${(numVal(inv.toppingTaro) * 0.5).toFixed(1)} kg)
Filling Coklat : ${inv.fillingCoklat || 0} pcs (${(numVal(inv.fillingCoklat) * 0.5).toFixed(1)} kg)
Filling Vanilla : ${inv.fillingVanilla || 0} pcs (${(numVal(inv.fillingVanilla) * 0.5).toFixed(1)} kg)
Filling Lemon : ${inv.fillingLemon || 0} pcs (${(numVal(inv.fillingLemon) * 0.5).toFixed(1)} kg)
Filling Peach : ${inv.fillingPeach || 0} pcs (${(numVal(inv.fillingPeach) * 0.5).toFixed(1)} kg)
Filling Raspberry : ${inv.fillingRaspberry || 0} pcs (${(numVal(inv.fillingRaspberry) * 0.5).toFixed(1)} kg)

*Ingredients & Powder* :
UHT : ${inv.uht || 0} pcs
Taro Powder : ${inv.taroPowder || 0} kg
Coklat Powder : ${inv.coklatPowder || 0} pack
Whipping Cream : ${inv.whippingCream || 0} pack
NDC Powder : ${inv.ndcPowder || 0} pack
Cheese Powder : ${inv.cheesePowder || 0} pack
Strawberry Konsentrat : ${inv.strawberryKonsentrat || 0} botol
Strawberry Flavoured Syrup : ${inv.strawberrySyrup || 0} botol
Blueberry Konsentrat : ${inv.blueberryKonsentrat || 0} pack

*Packaging & Operations* :
Paper Pouch : ${inv.paperPouch || 0} pcs
Familly Pack : ${inv.familyPack || 0} pcs
Plastik UK 20 : ${inv.plastik20 || 0} pack
Plastik UK 25 : ${inv.plastik25 || 0} pack
Plastik UK 35 : ${inv.plastik35 || 0} pack
Cupbler 22 Oz : ${inv.cupbler22 || 0} pcs
Cuplid 22 Oz : ${inv.cuplid22 || 0} pcs
Cup tray S : ${inv.cupTrayS || 0}
Cup tray M : ${inv.cupTrayM || 0}
Gloves M : ${inv.glovesM || 0} pack
Gloves L : ${inv.glovesL || 0} pack
Gloves XL : ${inv.glovesXL || 0} pack
Trash Bag : ${inv.trashBag || 0} pack
Thermal Paper : ${inv.thermalPaper || 0} pcs
Kuraflex hijau : ${inv.kuraflexHijau || 0} pack
Kuraflex pink : ${inv.kuraflexPink || 0} pack
Kitchen Mask : ${inv.kitchenMask || 0} pack

Terima Kasih 🙏🏻`;
      };

      const handleCopyToClipboard = (text) => {
        const tempTextArea = document.createElement('textarea');
        tempTextArea.value = text;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        try {
          document.execCommand('copy');
          showToast('Laporan berhasil disalin ke clipboard! 📋');
        } catch (err) {
          showToast('Gagal menyalin otomatis.');
        }
        document.body.removeChild(tempTextArea);
      };

      const handleSendToWA = () => {
        const text = generateReportString(salesData, inventoryData);
        const encodedText = encodeURIComponent(text);
        window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
      };

      const handleSendToTelegram = async () => {
        if (!config.telegramBotToken || !config.telegramChatId) {
          showToast('⚠️ Isi Bot Token dan Chat ID Telegram Anda di menu pengaturan (Roda Gigi) dahulu!');
          setShowConfig(true);
          return;
        }

        const reportMessage = generateReportString(salesData, inventoryData);
        try {
          showToast('Mengirim ke Telegram... ✈️');
          const response = await fetch(`https://api.telegram.org/bot${config.telegramBotToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: config.telegramChatId,
              text: reportMessage,
              parse_mode: 'Markdown'
            })
          });

          const result = await response.json();
          if (result.ok) {
            showToast('Laporan berhasil dikirim ke Telegram! 🚀');
          } else {
            showToast(`Gagal: ${result.description}`);
          }
        } catch (error) {
          showToast('Koneksi bermasalah saat mengirim ke Telegram.');
        }
      };

      const handleDeleteHistory = (id) => {
        const updated = historyList.filter(item => item.id !== id);
        setHistoryList(updated);
        localStorage.setItem('tarobun_history_web', JSON.stringify(updated));
        showToast('Riwayat berhasil dihapus.');
      };

      const handleExportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Tanggal,Roti Terjual (Pcs),Pendapatan (IDR),Suhu Freezer,Suhu Chiller,Dough Gagal Baking,Roti Matang Reject,Topping Taro Terpakai (KG)\n";
        
        historyList.forEach(item => {
          const row = [
            item.tanggal,
            item.totalSales,
            item.revenue,
            item.sales.suhuFreezer,
            item.sales.suhuChiller,
            item.sales.waste.doughGagalBaking,
            item.sales.waste.rotiMatang,
            ((item.totalSales * 25) / 1000).toFixed(3)
          ].join(",");
          csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Laporan_Tarobun_${salesData.tanggal}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('File CSV berhasil diunduh! 📊');
      };

      const loadHistoryToActive = (item) => {
        setSalesData(item.sales);
        setInventoryData(item.inventory);
        setActiveTab('dashboard');
        showToast(`Memuat data tanggal: ${item.tanggal} 🔄`);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-20">
          
          {/* Header */}
          <header className="bg-gradient-to-r from-purple-800 to-indigo-900 text-white shadow-md sticky top-0 z-20 px-4 py-3">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              <div className="flex items-center space-x-2">
                <div className="bg-white text-purple-800 w-8 h-8 rounded-full font-bold flex items-center justify-center text-md tracking-wider">
                  TB
                </div>
                <div>
                  <h1 className="font-bold text-sm md:text-base tracking-wide">TAROBUN</h1>
                  <p className="text-[10px] text-purple-200">Green Pramuka Hub & System</p>
                </div>
              </div>
              
              <div className="flex items-center space-x-2">
                <button 
                  onClick={() => setShowConfig(!showConfig)}
                  className="p-1.5 bg-purple-700/60 hover:bg-purple-600 rounded-lg text-white border border-purple-500/30 transition-all"
                  title="Integrasi API"
                >
                  <i data-lucide="settings" className="w-4 h-4"></i>
                </button>
                <button 
                  onClick={handleLoadSampleData}
                  className="flex items-center space-x-1 bg-purple-700/60 hover:bg-purple-600 px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-purple-500/30 text-yellow-300 transition-all"
                >
                  <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                  <span className="hidden sm:inline text-white">Muat Data Contoh</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-4xl w-full mx-auto p-4">
            
            {/* Connection Config Panel */}
            {showConfig && (
              <div className="bg-white rounded-2xl p-5 border border-purple-200 shadow-md mb-6 transition-all">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 mb-4">
                  <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <i data-lucide="settings" className="w-4 h-4 text-purple-700"></i>
                    <span>Pengaturan Integrasi Eksternal</span>
                  </h3>
                  <button onClick={() => setShowConfig(false)} className="text-slate-400 hover:text-slate-600 text-xs font-bold">Tutup</button>
                </div>
                <form onSubmit={handleSaveConfig} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Telegram Bot Token</label>
                      <input 
                        type="text" 
                        value={config.telegramBotToken}
                        onChange={(e) => setConfig({ ...config, telegramBotToken: e.target.value })}
                        placeholder="Contoh: 123456:ABC-def1234ghI"
                        className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-mono"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Telegram Chat ID / Group ID</label>
                      <input 
                        type="text" 
                        value={config.telegramChatId}

                    <div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Filling Vanilla (pcs)</label>
                      <input type="number" value={inventoryData.fillingVanilla} onChange={(e) => setInventoryData({ ...inventoryData, fillingVanilla: e.target.value })} className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm" placeholder="0" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Filling Lemon (pcs)</label>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Filling Peach (pcs)</label>
                      <input type="number" value={inventoryData.fillingPeach} onChange={(e) => setInventoryData({ ...inventoryData, fillingPeach: e.target.value })} className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm" placeholder="0" />

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Filling Raspberry (pcs)</label>
                      <input type="number" value={inventoryData.fillingRaspberry} onChange={(e) => setInventoryData({ ...inventoryData, fillingRaspberry: e.target.value })} className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm" placeholder="0" />

                </div>

                    <div>

                      <input type="number" value={inventoryData.cupbler22} onChange={(e) => setInventoryData({ ...inventoryData, cupbler22: e.target.value })} className="w-full px-3 py-1.5 border border-slate-300 rounded-lg" placeholder="0" />

                    <div>

                    <div>

                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1">Kuraflex Hijau (pack)</label>

                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1">Kuraflex Pink (pack)</label>
                      <input type="number" value={inventoryData.kuraflexPink} onChange={(e) => setInventoryData({ ...inventoryData, kuraflexPink: e.target.value })} className="w-full px-3 py-1.5 border border-slate-300 rounded-lg" placeholder="0" />

                      <input type="number" value={inventoryData.kitchenMask} onChange={(e) => setInventoryData({ ...inventoryData, kitchenMask: e.target.value })} className="w-full px-3 py-1.5 border border-slate-300 rounded-lg" placeholder="0" />

                  </div>
                </div>

                {/* Save Inventory */}
                <div className="pt-4 border-t border-slate-100">
                  <button onClick={handleSaveToDevice} className="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl transition-all shadow-sm">
                    Simpan Data & Hitung
                  </button>
                </div>
              </div>
            )}

            {/* Tab: History */}
            {activeTab === 'history' && (
              <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-6">

                      </div>
                    ))}

          </main>

          {/* Bottom Tabs Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg px-4 py-2 z-30 flex justify-around items-center max-w-4xl mx-auto">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center space-y-1 py-1 px-3 rounded-xl ${activeTab === 'dashboard' ? 'text-purple-800 bg-purple-50 font-bold' : 'text-slate-400'}`}>
              <i data-lucide="trending-up" className="w-5 h-5"></i>
              <span className="text-[10px]">Dasbor</span>
            </button>
            <button onClick={() => setActiveTab('sales')} className={`flex flex-col items-center space-y-1 py-1 px-3 rounded-xl ${activeTab === 'sales' ? 'text-purple-800 bg-purple-50 font-bold' : 'text-slate-400'}`}>

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
